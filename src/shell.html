<title>Académie CMD &amp; PowerShell</title>
<meta name="theme-color" content="#012456">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout : coquille d'application — rail à gauche sur ordinateur, barre d'onglets en bas sur téléphone ;
   colonne de lecture ~760px ; le lecteur de leçon s'ouvre en plein écran. Motifs : touches de clavier,
   ruban d'étiqueteuse (comme sur les baies), consoles aux vraies couleurs CMD (#0C0C0C) et PowerShell (#012456). */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#E1E6EE; --surface-3:#D3DAE5;
  --ink:#101A2D; --ink-2:#47536E; --ink-3:#77839C; --line:#CAD2DF; --key-edge:#B4BFD0;
  --ps:#2453C9; --ps-press:#173B97; --ps-soft:#DCE5FF; --on-accent:#FFFFFF;
  --cmd:#17191D; --cmd-soft:#E3E5E9;
  --ad:#0B766C; --ad-soft:#D2EFEB;
  --ms:#B4400B; --ms-soft:#FCE5D7;
  --base:#7A5D00; --base-soft:#FFF1BF;
  --tape:#FFD23F; --tape-ink:#18140A;
  --ok:#147A43; --ok-press:#0D5A30; --ok-soft:#D9F3E4;
  --bad:#C23434; --bad-press:#8E2222; --bad-soft:#FBE1E1;
  --warn:#8F5A00; --warn-soft:#FFEFCC;
  --con-cmd-bg:#0C0C0C; --con-cmd-fg:#CCCCCC; --con-ps-bg:#012456; --con-ps-fg:#EEEDF0;
  --con-bar:#1E1E1E; --con-bar-ps:#0B1B3F; --con-dim:#8A8A8A;
  --tk-cmd:#F9F1A5; --tk-sw:#61D6D6; --tk-str:#7CC4F0; --tk-var:#4ADE80; --tk-op:#FF7A85; --tk-path:#F2F2F2; --tk-num:#E8C38A; --tk-cm:#6A9F5B; --tk-kw:#D69CF5; --tk-type:#9FB7D6; --tk-err:#FF6B6B;
  --shadow: 0 1px 2px rgba(16,26,45,.06), 0 6px 18px rgba(16,26,45,.06);
  --f-display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --r-sm:9px;
  --rail:248px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131E; --surface:#151D2B; --surface-2:#1C2636; --surface-3:#253147;
    --ink:#E5EBF5; --ink-2:#A1AEC4; --ink-3:#74829B; --line:#2A364B; --key-edge:#0A0F18;
    --ps:#6B95FF; --ps-press:#3D63CC; --ps-soft:#1C2B52; --on-accent:#0B1226;
    --cmd:#D9DCE2; --cmd-soft:#262B33;
    --ad:#3CC9B8; --ad-soft:#123832;
    --ms:#FF8A4C; --ms-soft:#3D2416;
    --base:#F2C94C; --base-soft:#3A3115;
    --ok:#3DD68C; --ok-press:#1F9A5E; --ok-soft:#123426;
    --bad:#FF6B6B; --bad-press:#C24545; --bad-soft:#3B1A1D;
    --warn:#F5B94C; --warn-soft:#3A2C12;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131E; --surface:#151D2B; --surface-2:#1C2636; --surface-3:#253147;
  --ink:#E5EBF5; --ink-2:#A1AEC4; --ink-3:#74829B; --line:#2A364B; --key-edge:#0A0F18;
  --ps:#6B95FF; --ps-press:#3D63CC; --ps-soft:#1C2B52; --on-accent:#0B1226;
  --cmd:#D9DCE2; --cmd-soft:#262B33;
  --ad:#3CC9B8; --ad-soft:#123832;
  --ms:#FF8A4C; --ms-soft:#3D2416;
  --base:#F2C94C; --base-soft:#3A3115;
  --ok:#3DD68C; --ok-press:#1F9A5E; --ok-soft:#123426;
  --bad:#FF6B6B; --bad-press:#C24545; --bad-soft:#3B1A1D;
  --warn:#F5B94C; --warn-soft:#3A2C12;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ps);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:800}
h2{font-size:1.35rem;font-weight:750}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
code,kbd,pre,.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
.app{min-height:100%;display:grid;grid-template-columns:1fr}
.rail{display:none}
.main{min-width:0;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.view{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view.wide{max-width:1100px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:.72rem;color:var(--ink-3);font-weight:700}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--ps)}
.tabbar button[aria-current="page"] svg{transform:translateY(-1px)}
@media (min-width:900px){
  .app{grid-template-columns:var(--rail) 1fr}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{margin:0 8px 18px}
  .rail button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:11px;padding:11px 12px;font-weight:700;color:var(--ink-2);text-align:left}
  .rail button svg{width:22px;height:22px;flex:none}
  .rail button:hover{background:var(--surface-2)}
  .rail button[aria-current="page"]{background:var(--ps-soft);color:var(--ps)}
  .rail .rail-foot{margin-top:auto;padding:10px 12px;font-size:.8rem;color:var(--ink-3)}
  .tabbar{display:none}
  .main{padding-inline:32px;padding-block:30px 60px}
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.12rem;letter-spacing:-.01em}
.brand-mark{font-family:var(--f-mono);font-size:.78rem;font-weight:700;background:var(--con-ps-bg);color:var(--con-ps-fg);padding:5px 7px;border-radius:7px;letter-spacing:0}
.brand-mark b{color:var(--tk-cmd)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chips-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 8px;font-weight:700;font-size:.88rem}
.stat-chip svg{width:18px;height:18px}
.stat-chip.streak svg{color:#E8590C}
.stat-chip.xp svg{color:var(--warn)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync-dot.on{background:var(--ok)}

/* ---------- tape (ruban d'étiqueteuse) ---------- */
.tape{display:inline-block;font-family:var(--f-mono);font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;background:var(--tape);color:var(--tape-ink);padding:3px 8px 2px;border-radius:2px;line-height:1.4;white-space:nowrap}
.tape.cmd{background:var(--con-cmd-bg);color:#F2F2F2}
.tape.ps{background:var(--con-ps-bg);color:#F2F2F2}
.tape.ad{background:#0B766C;color:#F2FFFC}
.tape.ms{background:#B4400B;color:#FFF5EE}
.tape.lvl{background:var(--surface-2);color:var(--ink-2)}
.tape.ok{background:var(--ok);color:var(--on-accent)}

/* ---------- keycap buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);border-bottom-width:4px;border-bottom-color:var(--key-edge);background:var(--surface);color:var(--ink);border-radius:13px;padding:11px 18px;font-weight:700;font-size:1rem;line-height:1.2;transition:transform .06s, border-bottom-width .06s;text-decoration:none;user-select:none}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ps);border-color:var(--ps);border-bottom-color:var(--ps-press);color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);border-bottom-color:var(--ok-press);color:var(--on-accent)}
.btn.bad{background:var(--bad);border-color:var(--bad);border-bottom-color:var(--bad-press);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;border-bottom-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:10px;border-bottom-width:3px}
.btn svg{width:20px;height:20px}
.icon-btn{background:none;border:0;padding:8px;border-radius:10px;display:inline-flex;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:24px;height:24px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.meter{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter > i{display:block;height:100%;background:var(--ps);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meter.ok > i{background:var(--ok)}
.meter.tape > i{background:var(--tape)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* ---------- home ---------- */
.hello h1 span{color:var(--ps)}
.continue{position:relative;overflow:hidden;background:var(--con-ps-bg);color:var(--con-ps-fg);border-radius:18px;padding:20px;display:grid;gap:14px}
.continue .prompt{font-family:var(--f-mono);font-size:.85rem;color:#9FB7D6;word-break:break-all}
.continue .prompt b{color:var(--tk-cmd);font-weight:600}
.continue .prompt i{font-style:normal;color:var(--tk-sw)}
.continue h2{color:#fff;font-size:1.5rem}
.continue .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:#B9C7DE;font-size:.9rem}
.continue .btn.primary{background:var(--tape);border-color:var(--tape);border-bottom-color:#C9A11A;color:var(--tape-ink);justify-self:start}
.cursor{display:inline-block;width:.6em;height:1.05em;background:currentColor;vertical-align:-.15em;animation:blink 1.1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.goal{display:grid;gap:10px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal-top b{font-family:var(--f-display);font-size:1.25rem}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.track-card{display:grid;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-bottom-color:var(--key-edge);border-radius:16px;padding:16px;min-width:0}
.track-card:hover{border-color:var(--ink-3)}
.track-card:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.track-card h3{font-size:1.12rem}
.track-card p{font-size:.88rem;color:var(--ink-2)}
.track-card .row{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--ink-3);font-weight:700}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{display:grid;justify-items:start;gap:6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-bottom-color:var(--key-edge);border-radius:14px;padding:14px;min-width:0}
.quick button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.quick button svg{width:24px;height:24px;color:var(--ps)}
.quick button b{font-size:.95rem}
.quick button span{font-size:.78rem;color:var(--ink-2);line-height:1.35}
@media (max-width:460px){.quick{grid-template-columns:1fr 1fr}.quick button:last-child{grid-column:span 2}}
.tip-card{display:grid;gap:8px;border-left:0;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px}

/* ---------- parcours ---------- */
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.track-head{display:grid;gap:10px}
.track-head .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chapter{display:grid;gap:4px}
.chapter-h{display:flex;align-items:center;gap:10px;margin:8px 0 6px}
.chapter-h h3{font-size:1rem}
.chapter-h .rule{flex:1;height:1px;background:var(--line)}
.cable{position:relative;display:grid;gap:10px;padding-left:4px}
.cable::before{content:"";position:absolute;left:31px;top:20px;bottom:20px;width:3px;border-radius:3px;background:repeating-linear-gradient(var(--surface-3) 0 8px, transparent 8px 13px)}
.lesson-row{position:relative;display:flex;align-items:center;gap:14px;background:none;border:0;text-align:left;padding:4px;border-radius:14px;min-width:0}
.lesson-row:hover .lr-body{background:var(--surface)}
.keycap{flex:none;width:56px;height:56px;display:grid;place-items:center;border-radius:13px;background:var(--surface);border:1.5px solid var(--line);border-bottom:5px solid var(--key-edge);font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--ink-2);position:relative;z-index:1}
.keycap svg{width:24px;height:24px}
.lesson-row.done .keycap{background:var(--ok);border-color:var(--ok);border-bottom-color:var(--ok-press);color:var(--on-accent)}
.lesson-row.next .keycap{background:var(--tape);border-color:#E0B21E;border-bottom-color:#B88F12;color:var(--tape-ink)}
.lesson-row .lr-body{flex:1;min-width:0;padding:8px 10px;border-radius:11px;display:grid;gap:2px}
.lr-body b{font-size:1rem;line-height:1.3}
.lr-body span{font-size:.84rem;color:var(--ink-2);line-height:1.35}
.lr-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.ticket-no{font-family:var(--f-mono);font-size:.72rem;color:var(--ms);font-weight:700}

/* ---------- prose & components ---------- */
.prose{display:grid;gap:12px;font-size:1.04rem;max-width:68ch}
.prose p{line-height:1.62}
.prose ul{margin:0;padding-left:1.2em;display:grid;gap:5px}
.prose li{line-height:1.5}
.prose strong{font-weight:700}
.prose code, .inline-code{font-size:.88em;background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;white-space:break-spaces;word-break:break-word}
.callout{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border-radius:12px;padding:12px 14px;font-size:.96rem;line-height:1.5}
.callout svg{width:20px;height:20px;margin-top:2px}
.callout.tip{background:var(--ps-soft);color:var(--ink)}
.callout.tip svg{color:var(--ps)}
.callout.warn{background:var(--warn-soft)}
.callout.warn svg{color:var(--warn)}
.callout.it{background:var(--ad-soft)}
.callout.it svg{color:var(--ad)}
.callout .lbl{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:2px;opacity:.75}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td code{font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:5px;white-space:nowrap}

/* ---------- console ---------- */
.console{border-radius:12px;overflow:hidden;background:var(--con-cmd-bg);color:var(--con-cmd-fg);font-family:var(--f-mono);font-size:.86rem;line-height:1.5;box-shadow:var(--shadow);min-width:0}
.console.ps{background:var(--con-ps-bg);color:var(--con-ps-fg)}
.console .bar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--con-bar);color:#BDBDBD;font-family:var(--f-body);font-size:.78rem;font-weight:700}
.console.ps .bar{background:var(--con-bar-ps);color:#B8C6E0}
.console .bar .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.console .bar button{background:rgba(255,255,255,.08);border:0;color:inherit;border-radius:6px;padding:3px 8px;font-size:.74rem;font-weight:700}
.console .bar button:hover{background:rgba(255,255,255,.16)}
.console pre{margin:0;padding:12px 14px;overflow-x:auto;white-space:pre;tab-size:4}
.console pre.out{color:inherit;opacity:.92;border-top:1px dashed rgba(255,255,255,.12)}
.console pre.fillcode{white-space:pre-wrap;overflow-wrap:anywhere;line-height:2}
.console pre.out.live{max-height:46vh;overflow:auto}
.console .pr{color:var(--con-dim)}
.t-cmd{color:var(--tk-cmd)} .t-sw{color:var(--tk-sw)} .t-str{color:var(--tk-str)} .t-var{color:var(--tk-var)}
.t-op{color:var(--tk-op);font-weight:700} .t-path{color:var(--tk-path);text-decoration:underline;text-decoration-color:rgba(255,255,255,.25);text-underline-offset:3px}
.t-num{color:var(--tk-num)} .t-cm{color:var(--tk-cm);font-style:italic} .t-kw{color:var(--tk-kw)} .t-type{color:var(--tk-type)} .t-err{color:var(--tk-err)}
.t-warn{color:#F5D76E} .t-ok{color:#7EE2A8}

/* anatomie */
.anat{display:grid;gap:10px}
.anat-line{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;padding:14px;font-family:var(--f-mono);font-size:.95rem}
.anat-tok{border:0;background:rgba(255,255,255,.06);border-radius:7px;padding:4px 7px;font-family:var(--f-mono);font-size:.95rem;position:relative;outline:2px solid transparent;transition:background .15s, outline-color .15s}
.anat-tok sup{font-size:.6rem;color:var(--con-dim);margin-left:3px;font-family:var(--f-body);font-weight:700}
.anat-tok[aria-pressed="true"]{background:rgba(255,255,255,.16);outline-color:rgba(255,255,255,.55)}
.anat-list{display:grid;gap:6px}
.anat-item{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:.95rem;line-height:1.45;transition:background .15s,border-color .15s}
.anat-item.on{border-color:var(--ps);background:var(--ps-soft)}
.anat-item .k{font-family:var(--f-mono);font-size:.82rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--con-cmd-bg);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.anat-item .kind{display:block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.anat-item code{font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:5px}

/* ---------- lesson player ---------- */
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.player[hidden]{display:none!important}
.ph{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.ph .meter{flex:1;height:14px}
.ph .meter > i{background:var(--ok)}
.ph .xpnow{font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--warn);min-width:52px;text-align:right}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 16px 30px}
.pcard{max-width:720px;margin:0 auto;display:grid;gap:16px;animation:cardIn .28s ease-out}
@keyframes cardIn{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pcard .kind-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcard h2{font-size:clamp(1.25rem,3.6vw,1.6rem)}
.pfoot{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.pfoot .inner{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.pfoot .inner .btn{flex:1}
.pfoot.state-ok{background:var(--ok-soft);border-top-color:var(--ok)}
.pfoot.state-bad{background:var(--bad-soft);border-top-color:var(--bad)}
.fb{max-width:720px;margin:0 auto 12px;display:grid;gap:6px;animation:cardIn .2s ease-out}
.fb .fb-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.fb .fb-h svg{width:26px;height:26px}
.fb.ok .fb-h{color:var(--ok)}
.fb.bad .fb-h{color:var(--bad)}
.fb .fb-b{font-size:.96rem;line-height:1.5;max-height:34vh;overflow:auto}
.fb .fb-b code{font-size:.88em;background:var(--surface);padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
.fb .fb-ans{font-family:var(--f-mono);font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;overflow-x:auto;white-space:pre}

/* options */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-bottom-color:var(--key-edge);border-radius:13px;padding:13px 14px;font-size:1rem;line-height:1.4;min-width:0}
.opt .letter{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;border:1.5px solid var(--line);font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--ink-2)}
.opt .txt{min-width:0;overflow-wrap:anywhere}
.opt code{font-size:.92em}
.opt[aria-pressed="true"]{border-color:var(--ps);background:var(--ps-soft)}
.opt[aria-pressed="true"] .letter{background:var(--ps);border-color:var(--ps);color:var(--on-accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.tok-pool{display:flex;flex-wrap:wrap;gap:8px}
.tok{font-family:var(--f-mono);font-size:.95rem;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-bottom-color:var(--key-edge);border-radius:10px;padding:8px 12px;min-width:44px;max-width:100%;overflow-wrap:anywhere;text-align:center}
.tok:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.tok.used{visibility:hidden}
.answer-line{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:12px;background:var(--con-cmd-bg);color:var(--con-cmd-fg);font-family:var(--f-mono)}
.answer-line.ps{background:var(--con-ps-bg);color:var(--con-ps-fg)}
.answer-line .pr{color:var(--con-dim);font-size:.85rem;white-space:nowrap}
.answer-line .tok{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);border-bottom-color:rgba(0,0,0,.5);color:inherit}
.answer-line .ph-txt{color:var(--con-dim);font-size:.85rem}
.blank{display:inline-block;min-width:3.2em;padding:1px 8px;margin:0 2px;border-radius:6px;border:1.5px dashed rgba(255,255,255,.45);color:var(--tk-cmd);text-align:center;cursor:pointer;font:inherit;background:transparent}
.blank.filled{border-style:solid;background:rgba(255,255,255,.12)}
.blank.active{border-color:var(--tape)}
.typebox{display:grid;gap:0}
.typebox .line{display:flex;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap}
.typebox .line .pr{white-space:nowrap}
.typebox input{flex:1;min-width:160px;background:transparent;border:0;outline:0;color:inherit;font-family:var(--f-mono);font-size:16px;caret-color:var(--tape);padding:4px 0}
.typebox pre.out{max-height:300px}
.symbar{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.08);scrollbar-width:none}
.symbar::-webkit-scrollbar{display:none}
.symbar button{flex:none;min-width:38px;height:36px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:inherit;font-family:var(--f-mono);font-size:.92rem;font-weight:700;padding:0 10px;border-bottom:2px solid rgba(0,0,0,.45)}
.symbar button:active{background:rgba(255,255,255,.22)}
.symbar button.wordy{font-size:.78rem}
.hint{font-size:.92rem;color:var(--ink-2)}
.hint-btn{background:none;border:0;color:var(--ps);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket .t-top{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;background:var(--ms-soft);font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--ms);flex-wrap:wrap}
.ticket .t-body{padding:14px;display:grid;gap:6px;font-size:.98rem}
.ticket dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:.86rem}
.ticket dt{color:var(--ink-3);font-weight:700}
.ticket dd{margin:0}
.prio{padding:2px 8px;border-radius:5px;background:var(--ms);color:#fff}

/* résultats */
.result{max-width:560px;margin:0 auto;display:grid;gap:18px;text-align:center;justify-items:center;padding-top:4vh}
.result .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,7vw,3rem);line-height:1}
.result .trophy{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;background:var(--tape);color:var(--tape-ink);border-bottom:6px solid #B88F12}
.result .trophy svg{width:44px;height:44px}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.res-stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;display:grid;gap:2px}
.res-stats b{font-family:var(--f-display);font-size:1.5rem}
.res-stats span{font-size:.78rem;color:var(--ink-2);font-weight:700}
.result .actions{display:grid;gap:10px;width:100%}

/* ---------- terminal ---------- */
.term-layout{display:grid;gap:18px}
@media (min-width:1100px){.term-layout{grid-template-columns:minmax(0,1fr) 320px;align-items:start}}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:700;color:var(--ink-2);font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.term{display:flex;flex-direction:column;height:min(64vh,620px);min-height:360px}
.term .scr{flex:1;overflow:auto;padding:12px 14px;white-space:pre;font-size:.84rem;line-height:1.45;-webkit-overflow-scrolling:touch}
.term .scr .ln{min-height:1.45em}
.term .inrow{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid rgba(255,255,255,.08)}
.term .inrow .pr{white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.term .inrow input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:inherit;font-family:var(--f-mono);font-size:16px;caret-color:var(--tape)}
.missions{display:grid;gap:10px}
.mission{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:.92rem;line-height:1.4}
.mission .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.mission.done .box{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.mission.done .box svg{width:14px;height:14px}
.mission .mh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.mission details{margin-top:4px}
.mission summary{cursor:pointer;color:var(--ps);font-weight:700;font-size:.84rem}
.mission code{font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:5px;word-break:break-all}

/* ---------- mémo ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:12px 0;font-size:16px}
.entries{display:grid;gap:8px}
details.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
details.entry > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px}
details.entry > summary::-webkit-details-marker{display:none}
details.entry > summary .nm{font-family:var(--f-mono);font-weight:700;font-size:.98rem;white-space:nowrap}
details.entry > summary .ds{font-size:.88rem;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.entry > summary .chev{width:18px;height:18px;color:var(--ink-3);transition:transform .2s}
details.entry[open] > summary .chev{transform:rotate(90deg)}
details.entry[open] > summary .ds{white-space:normal}
.entry-body{padding:0 14px 14px;display:grid;gap:12px;min-width:0}
.ety{font-size:.9rem;color:var(--ink-2)}
.mn b{color:var(--ps);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.sw-list{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sw-row{display:grid;grid-template-columns:minmax(80px,auto) 1fr;gap:4px 14px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.92rem;line-height:1.45}
.sw-row:last-child{border-bottom:0}
.sw-row .s{font-family:var(--f-mono);font-weight:700;color:var(--ink);white-space:nowrap}
.sw-row .mn{display:block;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3)}
.sw-row code{font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
@media (max-width:480px){.sw-row{grid-template-columns:1fr}}
.ex-list{display:grid;gap:8px}
.ex{display:grid;gap:4px}
.ex .console pre{padding:8px 12px}
.ex .d{font-size:.88rem;color:var(--ink-2)}
.syn{font-family:var(--f-mono);font-size:.86rem;background:var(--surface-2);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:6px}
.eq-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.eq-row .d{grid-column:1/-1;font-size:.88rem;color:var(--ink-2)}
.eq-row .c{min-width:0}
.eq-row .c .console pre{padding:7px 10px;font-size:.8rem}
@media (max-width:520px){.eq-row{grid-template-columns:1fr}}

/* ---------- profil ---------- */
.profile-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.avatar{width:72px;height:72px;border-radius:18px;background:var(--con-ps-bg);color:var(--tk-cmd);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:1.3rem;border-bottom:5px solid #000E2A}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--ink-2);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:grid;gap:6px;justify-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;opacity:.5;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-color:var(--tape)}
.badge .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--tape);color:var(--tape-ink)}
.badge .ico svg{width:22px;height:22px}
.badge b{font-size:.92rem}
.badge span{font-size:.78rem;color:var(--ink-2);line-height:1.35}
.settings{display:grid;gap:14px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.set-row label,.set-row .lbl{font-weight:700}
.confirm{display:grid;gap:10px;background:var(--bad-soft);border-radius:12px;padding:12px}
.acct{display:grid;gap:14px}
.acct-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.acct-top h2{font-size:1.25rem}
.acct-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.acct-id{display:grid;min-width:0;flex:1 1 170px}
.acct-id b{font-size:1.05rem;overflow-wrap:anywhere}
.acct-id span{overflow-wrap:break-word;word-break:break-word}
.avatar.sm{width:44px;height:44px;border-radius:12px;font-size:.95rem;border-width:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.auth-form{display:grid;gap:12px;max-width:440px}
.auth-form label{display:grid;gap:6px;font-weight:700;font-size:.92rem}
.auth-form input{font:inherit;font-weight:400;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.auth-form input:focus{outline:none;border-color:var(--ps);box-shadow:0 0 0 3px var(--ps-soft)}
.pw{position:relative;display:block}
.pw input{padding-right:92px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--surface-2);border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:.8rem;font-weight:700;color:var(--ink-2);cursor:pointer}
.auth-form .hint-s{font-weight:400;font-size:.8rem;color:var(--ink-3)}
.auth-form .btn{justify-self:start}
.link-btn{background:none;border:0;padding:4px 0;color:var(--ps);font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;justify-self:start;text-decoration:underline;text-underline-offset:3px}
#railFoot a.link{color:inherit;font-weight:700}
.acct-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-color:var(--ps);background:var(--ps-soft)}
.acct-cta>div{display:grid;gap:2px;min-width:0}
.hist{display:grid;gap:0;padding:6px 14px}
.hist-row{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist-row:last-child{border-bottom:0}
.hist-row .hist-t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.hist-row .small{grid-column:2}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.92rem;transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:28px}}
.empty{color:var(--ink-3);text-align:center;padding:30px 10px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
